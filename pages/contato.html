<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="author" content="Victor Nunes">
    <title>Contato - Batman vs Superman</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../css/mystyle.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg fixed-top bg-cor-que-eu-quero">
            <section class="container py-1">
                <a class="navbar-brand" href="../index.html">
                    <img class="img-fluid" width="40em" src="../images/vs.svg" alt="Logo VS">
                    <span>Batman vs Superman</span>
                </a>

                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar-items"
                    aria-controls="navbar-items" aria-expanded="false" aria-label="Navegação diferente">
                    <i class="bi bi-filter-square-fill"></i>
                </button>

                <section class="collapse navbar-collapse" id="navbar-items">
                    <ul class="navbar-nav me-auto mb-0 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="historia.html">História</a></li>
                        <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                        <li class="nav-item"><a class="nav-link" href="dicas.html">Dicas</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
                    </ul>
                </section>
            </section>
        </nav>
    </header>

    <main class="container pagina" id="container-top">
        <h1 class="text-center mb-4">Contato</h1>

        <section class="row g-3">
            <section class="col-12 col-md-6">
                <section class="card h-100">
                    <section class="card-body">
                        <h5 class="card-title">Envie uma mensagem</h5>
                        <form id="form-contato">
                            <section class="mb-3">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" required>
                            </section>
                            <section class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" required>
                            </section>
                            <section class="mb-3">
                                <label for="mensagem" class="form-label">Mensagem</label>
                                <textarea class="form-control" id="mensagem" rows="4" required></textarea>
                            </section>
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>
                        <p class="mt-3 mb-0" id="resposta-contato"></p>
                    </section>
                </section>
            </section>

            <section class="col-12 col-md-6">
                <section class="card h-100">
                    <section class="card-body">
                        <h5 class="card-title">Outros contatos</h5>
                        <p class="card-text">Autor: Victor Nunes</p>
                        <p class="card-text">Instagram: <a href="https://www.instagram.com/nunes_vitor7/" target="_blank" rel="noopener">@nunes_vitor7</a></p>
                        <a href="https://www.instagram.com/nunes_vitor7/" target="_blank" rel="noopener" class="btn btn-primary">
                            <i class="bi bi-instagram"></i> Chamar no Instagram
                        </a>
                    </section>
                </section>
            </section>
        </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- JS da página de contato -->
    <script>
        // Formulário de exemplo: não envia nada para a internet, só mostra uma resposta na tela
        document.getElementById('form-contato').addEventListener('submit', function (event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            document.getElementById('resposta-contato').textContent =
                `Obrigado, ${nome}! Sua mensagem foi registrada (formulário de demonstração).`;
            event.target.reset();
        });
    </script>
</body>

</html>
